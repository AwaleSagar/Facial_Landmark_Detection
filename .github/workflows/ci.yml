name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --group dev

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --group dev --python ${{ matrix.python-version }}

      # The 68-point LBF weights live in the checkout; YuNet is fetched once
      # and cached, so the test job does not hit the network on every run.
      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/facial-landmarks
          key: models-yunet-2023mar

      - name: Prefetch model weights
        run: uv run facial-landmarks models --fetch

      - name: Run tests
        run: uv run pytest --cov --cov-report=xml --cov-report=term-missing

      # The notebook's outputs are committed so it reads on GitHub without
      # being run. Execute it here so they cannot quietly drift from what the
      # library actually does - which is how the original notebook rotted.
      - name: Execute the notebook
        if: matrix.python-version == '3.12'
        run: uv run python scripts/run_notebook.py --check

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  benchmark:
    name: Detector benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install project
        run: uv sync --group dev

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/facial-landmarks
          key: models-yunet-2023mar

      - name: Compare backends on the sample set
        run: |
          uv run facial-landmarks benchmark data/ --json benchmark.json
          {
            echo '### Detector benchmark'
            echo
            echo '| backend | images with a face | recall | ms/image |'
            echo '| --- | --- | --- | --- |'
            uv run python -c "
          import json
          for row in json.load(open('benchmark.json')):
              print('| {backend} | {images_with_a_face}/{images} | {recall:.1%} | {ms_per_image} |'.format(**row))
          "
          } >> "$GITHUB_STEP_SUMMARY"
